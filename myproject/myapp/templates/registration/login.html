<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン画面</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <!-- BootstrapのCSSをCDNから読み込む -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <form method="post" class="bg-white p-4 rounded shadow-sm">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">ユーザID:</label>
                <input type="text" name="username" id="id_username" class="form-control">
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label">パスワード:</label>
                <input type="password" name="password" id="id_password" class="form-control">
            </div>
            <div class="d-flex justify-content-between gap-3 mt-3">
                <button type="submit" class="btn btn-primary w-50">ログイン</button>
                <a href="{% url 'register' %}" class="btn btn-secondary w-50">新規登録</a>
            </div>
        </form>
    </div>

    <!-- BootstrapのJavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
