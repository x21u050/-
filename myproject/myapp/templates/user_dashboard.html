<!DOCTYPE html>
<html lang="ja">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー画面</title>
    <!-- BootstrapのCSSをCDNから読み込む -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 追加のスタイル -->
    <!-- <link rel="stylesheet" href="{% static 'myapp/style.css' %}"> -->
</head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="bg-white p-4 rounded shadow-sm">
                <h1 class="text-center mb-4">ようこそ {{ request.user.username}} さん</h1>
                <form method="post" action="{% url 'image_list' %}" class="text-center mt-3">
                    {% csrf_token %}
                    <p> <button type="submit" class="btn btn-primary w-100">画像変更ボタン</button></p>
                </form>
                <form method="POST" action="{% url 'start_ai_app' %}" class="text-center mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary w-100">AIアプリを起動</button>
                </form>
                <form method="POST" action="{% url 'delete_account' %}" class="text-center mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary w-100">退会</button>
                </form>
                <form method="post" action="{% url 'logout' %}" class="text-center mt-3">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary w-100">ログアウト</button>
                </form>
            </div>
        </div>
    </body>
</html>
